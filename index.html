<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Recorrido 360 - Lote de Musáceas</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <style>
      #boton-vr {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 99999;
        padding: 14px 22px;
        background: #2196F3;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 18px;
        font-family: sans-serif;
        cursor: pointer;
      }
      #nombre-escena {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 99999;
        padding: 10px 18px;
        background: rgba(0,0,0,0.6);
        color: white;
        border-radius: 8px;
        font-size: 15px;
        font-family: sans-serif;
      }
    </style>
  </head>
  <body>

    <button id="boton-vr">Entrar en VR</button>
    <div id="nombre-escena">Estación principal</div>

    <a-scene xr-mode-ui="enterVRButton: #boton-vr">

      <a-assets>
        <img id="escena1" src="estacion_instalada.jpg">
        <img id="dashboardHumedad" src="dashboard_humedad.png">
        <video id="videoDashboard" src="dashboard_sucrologgers.mp4" preload="auto" playsinline webkit-playsinline></video>
      </a-assets>

      <a-sky id="sky" src="#escena1" rotation="0 0 0"></a-sky>

      <!-- ============ ÍCONO + PANEL DE INFORMACIÓN, GENÉRICOS ============ -->
      <!-- Un solo ícono que cambia de color/símbolo, y un solo panel
           que muestra imagen O video según la escena. Ajusta "pos" de
           cada uno (abajo, en JS) con el Inspector. -->
      <a-entity
        id="info-icon"
        class="clickable"
        visible="false"
        geometry="primitive: circle; radius: 0.15"
        material="shader: flat"
        animation__pulse="property: scale; dir: alternate; dur: 1000; easing: easeInOutSine; loop: true; to: 1.15 1.15 1.15">
        <a-text id="info-icon-texto" value="i" align="center" color="#FFFFFF" width="3" position="0 0 0.01"></a-text>
        <a-triangle
          id="info-icon-play"
          visible="false"
          color="#FFFFFF"
          vertex-a="-0.045 0.06 0.01"
          vertex-b="-0.045 -0.06 0.01"
          vertex-c="0.07 0 0.01">
        </a-triangle>
      </a-entity>

      <a-entity id="info-panel" visible="false">
        <a-image id="panel-imagen" src="#dashboardHumedad" width="1" height="0.56" visible="false"></a-image>
        <a-video id="panel-video" src="#videoDashboard" width="1.6" height="0.83" class="clickable" visible="false"></a-video>
        <a-entity id="cerrar-panel" class="clickable" position="0.58 0.34 0.02"
          geometry="primitive: circle; radius: 0.06" material="color: #E53935; shader: flat">
          <a-text value="✕" align="center" color="#FFFFFF" width="0.55" position="0 0 0.02"></a-text>
        </a-entity>
      </a-entity>

      <!-- ============ MENÚ "VISTAS" (navegación libre) ============ -->
      <!-- FIJO en el espacio (no en la cámara): no sigue la cabeza,
           hay que girar hacia él para encontrarlo, como el ícono
           del sensor. Ajusta su posición con el Inspector si quieres
           que quede en otro lugar de cada escena. -->
      <a-entity
        id="boton-vistas"
        class="clickable"
        position="0 -0.4 -3"
        geometry="primitive: plane; width: 1; height: 0.32"
        material="color: #2196F3; shader: flat">
        <a-text value="VISTAS" align="center" color="#FFFFFF" width="4" position="0 0 0.01"></a-text>
      </a-entity>

      <a-entity id="menu-vistas" visible="false" position="0 0.3 -3.2">
        <a-plane width="2.05" height="1.95" color="#111111" opacity="0.9"></a-plane>
        <!-- Las 6 opciones se generan por JavaScript más abajo -->
      </a-entity>

      <a-camera>
      </a-camera>

      <!-- Cursor normal de mouse en PC -->
      <a-entity cursor="rayOrigin: mouse" raycaster="objects: .clickable; far: 20"></a-entity>

      <!-- Controles láser para las gafas -->
      <a-entity laser-controls="hand: left" raycaster="objects: .clickable; far: 20"></a-entity>
      <a-entity laser-controls="hand: right" raycaster="objects: .clickable; far: 20"></a-entity>

    </a-scene>

    <script>
      var sky = document.querySelector('#sky');
      var nombreEscena = document.querySelector('#nombre-escena');

      var infoIcon = document.querySelector('#info-icon');
      var infoIconTexto = document.querySelector('#info-icon-texto');
      var infoIconPlay = document.querySelector('#info-icon-play');
      var infoPanel = document.querySelector('#info-panel');
      var panelImagen = document.querySelector('#panel-imagen');
      var panelVideo = document.querySelector('#panel-video');
      var videoHTML = document.querySelector('#videoDashboard');

      // ================== CONFIGURA AQUÍ CADA ESCENA ==================
      // "info": null si esa escena no tiene ícono, o un objeto con:
      //   type: 'image' | 'video'
      //   src: el id del recurso (#dashboardHumedad, #videoDashboard...)
      //   iconPos: posición del ícono en esa escena
      //   panelPos: posición del panel en esa escena
      var escenas = [
        {
          id: '#escena1', archivo: 'estacion_instalada.jpg', nombre: 'Estación principal',
          info: {
            type: 'video', src: '#videoDashboard',
            iconPos: '-1.742 0.257 -0.054', iconRot: '0 92.163 -8.382', iconScale: '1.008 1.008 1.008',
            panelPos: '0 1.2 -3'
          }
        },
        { id: null, archivo: 'estacion_desinstalada.jpg', nombre: 'Detalle sensores', info: null },
        {
          id: null, archivo: 'sensor_humedad_suelo.jpg', nombre: 'Sensor de humedad de suelo',
          info: {
            type: 'image', src: '#dashboardHumedad',
            iconPos: '-0.137 0.515 3.474', iconRot: '0 175.53 0', iconScale: '1.016 1.016 1.016',
            panelPos: '0 1.2 -3'
          }
        },
        { id: null, archivo: 'sensor_microclima_zoom.jpg', nombre: 'Sensor de microclima', info: null },
        { id: null, archivo: 'vista_interior_2.jpg', nombre: 'Interior del cultivo', info: null },
        { id: null, archivo: 'vista_superior.jpg', nombre: 'Vista superior del cultivo', info: null }
      ];
      var pasoActual = 0;

      function cerrarPanel() {
        infoPanel.setAttribute('visible', false);
        panelImagen.setAttribute('visible', false);
        panelVideo.setAttribute('visible', false);
        videoHTML.pause();
      }

      // Guarda las fotos ya descargadas para no volver a traerlas
      var cacheFotos = {};

      function mostrarEscena(indice) {
        pasoActual = indice;
        var escena = escenas[indice];
        var referencia = escena.id ? escena.id : ('#' + cacheFotos[escena.archivo].id);
        sky.setAttribute('src', referencia);
        nombreEscena.textContent = escena.nombre;
        cerrarPanel();

        if (escena.info) {
          infoIcon.setAttribute('visible', true);
          infoIcon.setAttribute('position', escena.info.iconPos);
          infoIcon.setAttribute('rotation', escena.info.iconRot || '0 0 0');
          infoIcon.setAttribute('scale', escena.info.iconScale || '1 1 1');
          infoPanel.setAttribute('position', escena.info.panelPos);

          if (escena.info.type === 'image') {
            infoIcon.setAttribute('material', 'color', '#2196F3');
            infoIconTexto.setAttribute('visible', true);
            infoIconPlay.setAttribute('visible', false);
            panelImagen.setAttribute('src', escena.info.src);
          } else {
            infoIcon.setAttribute('material', 'color', '#FF9800');
            infoIconTexto.setAttribute('visible', false);
            infoIconPlay.setAttribute('visible', true);
          }
        } else {
          infoIcon.setAttribute('visible', false);
        }

        cerrarMenu();
      }

      function irAEscena(indice) {
        var escena = escenas[indice];

        // Ya tiene id fijo (la primera, precargada) o ya se descargó antes
        if (escena.id || cacheFotos[escena.archivo]) {
          mostrarEscena(indice);
          return;
        }

        // Toca descargarla: muestra "Cargando..." mientras tanto
        nombreEscena.textContent = 'Cargando ' + escena.nombre + '...';

        var img = document.createElement('img');
        var idNuevo = 'foto_' + escena.archivo.replace(/[^a-zA-Z0-9]/g, '_');
        img.setAttribute('id', idNuevo);
        img.setAttribute('crossorigin', 'anonymous');
        img.addEventListener('load', function () {
          cacheFotos[escena.archivo] = { id: idNuevo };
          mostrarEscena(indice);
        });
        img.setAttribute('src', escena.archivo);
        document.querySelector('a-assets').appendChild(img);
      }

      infoIcon.addEventListener('click', function () {
        var escena = escenas[pasoActual];
        if (!escena.info) return;
        infoPanel.setAttribute('visible', true);
        if (escena.info.type === 'image') {
          panelImagen.setAttribute('visible', true);
        } else {
          panelVideo.setAttribute('visible', true);
          videoHTML.currentTime = 0;
          videoHTML.play();
        }
      });

      document.querySelector('#cerrar-panel').addEventListener('click', cerrarPanel);
      panelVideo.addEventListener('click', function () {
        if (videoHTML.paused) { videoHTML.play(); } else { videoHTML.pause(); }
      });

      // ================== MENÚ "VISTAS" ==================
      var menuVistas = document.querySelector('#menu-vistas');
      var botonVistas = document.querySelector('#boton-vistas');
      var menuAbierto = false;

      // Genera las 6 tarjetas del menú, en 2 columnas x 3 filas
      var columnas = 2, filas = 3;
      var anchoTarjeta = 0.95, altoTarjeta = 0.55, espacio = 0.06;
      var tarjetas = [];

      // Dibuja el texto de cada tarjeta como IMAGEN (canvas), para que
      // cualquier acento o símbolo se vea correctamente siempre,
      // sin depender de qué letras tenga la fuente 3D de A-Frame.
      function crearTexturaTexto(texto) {
        var canvas = document.createElement('canvas');
        canvas.width = 512; canvas.height = 256;
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = '#1B5E20';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#FFFFFF';
        ctx.font = 'bold 46px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        // Parte el texto en líneas para que no se salga del cuadro
        var palabras = texto.split(' ');
        var lineas = [];
        var lineaActual = '';
        palabras.forEach(function (palabra) {
          var prueba = lineaActual ? lineaActual + ' ' + palabra : palabra;
          if (ctx.measureText(prueba).width > canvas.width - 40 && lineaActual) {
            lineas.push(lineaActual);
            lineaActual = palabra;
          } else {
            lineaActual = prueba;
          }
        });
        lineas.push(lineaActual);

        var alturaLinea = 54;
        var yInicial = canvas.height / 2 - ((lineas.length - 1) * alturaLinea) / 2;
        lineas.forEach(function (linea, i) {
          ctx.fillText(linea, canvas.width / 2, yInicial + i * alturaLinea);
        });

        return canvas.toDataURL('image/png');
      }

      escenas.forEach(function (escena, indice) {
        var col = indice % columnas;
        var fila = Math.floor(indice / columnas);
        var x = (col - 0.5) * (anchoTarjeta + espacio);
        var y = (filas - 1) / 2 * (altoTarjeta + espacio) - fila * (altoTarjeta + espacio);

        var tarjeta = document.createElement('a-entity');
        tarjeta.setAttribute('geometry', 'primitive: plane; width: ' + anchoTarjeta + '; height: ' + altoTarjeta);
        tarjeta.setAttribute('material', { shader: 'flat', src: crearTexturaTexto(escena.nombre) });
        tarjeta.setAttribute('position', x + ' ' + y + ' 0.01');

        tarjeta.addEventListener('click', function () {
          irAEscena(indice);
        });

        menuVistas.appendChild(tarjeta);
        tarjetas.push(tarjeta);
      });

      function abrirMenu() {
        menuVistas.setAttribute('visible', true);
        tarjetas.forEach(function (t) { t.classList.add('clickable'); });
        menuAbierto = true;
      }
      function cerrarMenu() {
        menuVistas.setAttribute('visible', false);
        tarjetas.forEach(function (t) { t.classList.remove('clickable'); });
        menuAbierto = false;
      }

      botonVistas.addEventListener('click', function () {
        if (menuAbierto) { cerrarMenu(); } else { abrirMenu(); }
      });

      // Estado inicial
      irAEscena(0);
    </script>

  </body>
</html>
