<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Recorrido 360 - Lote de Musáceas</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <style>
      #boton-vr {
        position: fixed;
        top: 20px;
        left: 20px;
        z-index: 99999;
        padding: 14px 22px;
        background: #2196F3;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 18px;
        font-family: sans-serif;
        cursor: pointer;
      }
    </style>
  </head>
  <body>

    <button id="boton-vr">Entrar en VR</button>

    <a-scene xr-mode-ui="enterVRButton: #boton-vr">

      <a-assets>
        <img id="drone1" src="drone_01.jpg">
        <img id="drone2" src="drone_02.jpg">
        <img id="drone3" src="drone_03.jpg">
        <img id="interior1" src="interior_01.jpg">
        <img id="dashboard1" src="dashboard_estacion.png">
      </a-assets>

      <a-sky id="sky" src="#drone1" rotation="0 0 0"></a-sky>

      <!-- ============================================= -->
      <!-- UN SOLO hotspot que se reposiciona y apunta al  -->
      <!-- siguiente punto en cada paso (evita el bug de   -->
      <!-- varios círculos apilados invisibles).            -->
      <!-- Ajusta "pos" de cada parada con el Inspector.    -->
      <!-- ============================================= -->
      <a-entity
        id="hotspot"
        class="clickable"
        position="0 -0.3 -3"
        geometry="primitive: circle; radius: 0.3"
        material="color: #FFD700; shader: flat; opacity: 0.85"
        animation__pulse="property: scale; dir: alternate; dur: 800; easing: easeInOutSine; loop: true; to: 1.2 1.2 1.2">
      </a-entity>

      <!-- Ícono del sensor: ajusta esta posición con el Inspector
           para que quede exactamente sobre el equipo en drone_01 -->
      <a-entity
        id="info-icon-sensor"
        class="clickable"
        position="-0.1 0.5 -4"
        geometry="primitive: circle; radius: 0.15"
        material="color: #2196F3; shader: flat"
        animation__pulse="property: scale; dir: alternate; dur: 1000; easing: easeInOutSine; loop: true; to: 1.15 1.15 1.15">
        <a-text value="i" align="center" color="#FFFFFF" width="3" position="0 0 0.01"></a-text>
      </a-entity>

      <!-- Cámara: el panel del dashboard va DENTRO de la cámara,
           así siempre aparece fijo frente a ti, sin torcerse -->
      <a-camera>
        <a-cursor raycaster="objects: .clickable" fuse="false"></a-cursor>

        <a-entity id="dashboard-panel" visible="false" position="0 0 -1.5">
          <a-image src="#dashboard1" width="1.6" height="1"></a-image>
          <a-entity
            id="close-dashboard"
            class="clickable"
            position="0.75 0.45 0.01"
            geometry="primitive: circle; radius: 0.07"
            material="color: #FF4444; shader: flat">
            <a-text value="X" align="center" color="#FFFFFF" width="6" position="0 0 0.01"></a-text>
          </a-entity>
        </a-entity>
      </a-camera>

    </a-scene>

    <script>
      var sky = document.querySelector('#sky');
      var hotspot = document.querySelector('#hotspot');

      // Secuencia del recorrido. "hotspotPos" es la posición del punto
      // dorado EN ESA ESCENA (ajústala con el Inspector para que apunte
      // realmente hacia donde lleva el siguiente salto).
      var recorrido = [
        { sky: '#drone1', next: '#drone2', hotspotPos: '0 -0.3 -3' },
        { sky: '#drone2', next: '#drone3', hotspotPos: '0 -0.3 -3' },
        { sky: '#drone3', next: '#interior1', hotspotPos: '0 -0.3 -3' },
        { sky: '#interior1', next: null, hotspotPos: '0 -0.3 -3' }
      ];
      var pasoActual = 0;

      // Posición inicial del hotspot (paso 0)
      hotspot.setAttribute('position', recorrido[0].hotspotPos);

      hotspot.addEventListener('click', function () {
        var siguiente = recorrido[pasoActual].next;
        if (!siguiente) return;

        sky.setAttribute('src', siguiente);
        pasoActual++;

        if (recorrido[pasoActual].next) {
          hotspot.setAttribute('position', recorrido[pasoActual].hotspotPos);
          hotspot.setAttribute('visible', true);
        } else {
          hotspot.setAttribute('visible', false);
        }
      });

      // Ícono del sensor: abre/cierra el panel del dashboard
      document.querySelector('#info-icon-sensor').addEventListener('click', function () {
        document.querySelector('#dashboard-panel').setAttribute('visible', true);
      });
      document.querySelector('#close-dashboard').addEventListener('click', function () {
        document.querySelector('#dashboard-panel').setAttribute('visible', false);
      });
    </script>

  </body>
</html>
