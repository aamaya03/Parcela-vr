<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Recorrido 360 - Lote de Musáceas</title>
    <script src="aframe.min.js?v=54c06228"></script>
    <script>
      // Hace que un objeto mire SIEMPRE hacia la persona: de frente,
      // derecho y sin efecto espejo, desde cualquier ángulo.
      AFRAME.registerComponent('face-camera', {
        init: function () { this.camPos = new THREE.Vector3(); },
        tick: function () {
          var cam = this.el.sceneEl.camera;
          if (!cam) return;
          cam.getWorldPosition(this.camPos);
          this.el.object3D.lookAt(this.camPos);
        }
      });

      // Igual que face-camera, pero gira SOLO de lado (eje vertical): el objeto queda
      // siempre derecho, sin inclinarse hacia adelante ni hacia atrás.
      AFRAME.registerComponent('face-camera-y', {
        init: function () { this.camPos = new THREE.Vector3(); },
        tick: function () {
          var cam = this.el.sceneEl.camera;
          if (!cam) return;
          cam.getWorldPosition(this.camPos);
          var p = this.el.object3D.position;
          this.el.object3D.rotation.set(0, Math.atan2(this.camPos.x - p.x, this.camPos.z - p.z), 0);
        }
      });

      // Mantiene un contenedor SIEMPRE centrado en la cabeza de la persona
      // (sin rotarlo). Los íconos van adentro, así quedan en la dirección
      // correcta de la foto sin importar la altura de quien mira.
      AFRAME.registerComponent('sigue-camara', {
        init: function () { this.p = new THREE.Vector3(); },
        tick: function () {
          var cam = this.el.sceneEl.camera;
          if (!cam) return;
          cam.getWorldPosition(this.p);
          this.el.object3D.position.copy(this.p);
        }
      });
    </script>
    <style>
      #boton-vr {
        position: fixed; top: 20px; left: 20px; z-index: 99999;
        padding: 14px 22px; background: #2196F3; color: white; border: none;
        border-radius: 8px; font-size: 18px; font-family: sans-serif; cursor: pointer;
      }
      #nombre-escena {
        position: fixed; top: 20px; right: 20px; z-index: 99999;
        padding: 10px 18px; background: rgba(0,0,0,0.6); color: white;
        border-radius: 8px; font-size: 15px; font-family: sans-serif;
      }
      #version {
        position: fixed; bottom: 10px; left: 10px; z-index: 99999;
        padding: 4px 10px; background: rgba(0,0,0,0.5); color: #fff;
        border-radius: 5px; font-size: 12px; font-family: sans-serif;
      }
    </style>
  </head>
  <body>

    <button id="boton-vr">Entrar en VR</button>
    <div id="nombre-escena">1) Adéntrate en la parcela digital</div>
    <div id="version">Versión 33<br><span id="sin-internet"></span></div>

    <a-scene xr-mode-ui="enterVRButton: #boton-vr">

      <a-assets>
        <img id="escena1" src="vista_interior_2.jpg?v=d7c8dd48">
        <video id="videoDashboard" src="dashboard_sucrologgers.mp4?v=fc7582da" preload="auto" playsinline webkit-playsinline></video>
        <video id="videoHumedad" src="dashboard_humedad.mp4?v=1603f99d" preload="auto" playsinline webkit-playsinline></video>
        <video id="videoMicroclima" src="dashboard_microclima.mp4?v=e60735b6" preload="auto" playsinline webkit-playsinline></video>
      </a-assets>

      <a-sky id="sky" src="#escena1" rotation="0 101 0"></a-sky>

      <!-- Aquí se crean los íconos de información de cada escena -->
      <a-entity id="ancla" sigue-camara></a-entity>

      <!-- Panel que se abre: se ubica entre tú y el ícono, de frente a ti -->
      <a-entity id="info-panel" face-camera-y visible="false">
        <a-image id="panel-imagen" width="1.6" height="0.9" visible="false"></a-image>
        <a-image id="panel-imagen-2" width="1.6" height="0.9" visible="false"></a-image>
        <a-image id="panel-imagen-3" width="1.6" height="0.9" visible="false"></a-image>
        <a-video id="panel-video" src="#videoDashboard" width="1.6" height="0.83" visible="false"></a-video>
        <a-video id="panel-video-humedad" src="#videoHumedad" width="1.8" height="0.72" visible="false"></a-video>
        <a-video id="panel-video-microclima" src="#videoMicroclima" width="2" height="1.07" visible="false"></a-video>
        <a-entity id="cerrar-panel" position="0.8 0.45 0.03"
          geometry="primitive: circle; radius: 0.07" material="color: #E53935; shader: flat">
          <a-plane width="0.08" height="0.016" color="#FFFFFF" shader="flat" rotation="0 0 45" position="0 0 0.005"></a-plane>
          <a-plane width="0.08" height="0.016" color="#FFFFFF" shader="flat" rotation="0 0 -45" position="0 0 0.005"></a-plane>
        </a-entity>
      </a-entity>

      <!-- Menú de la parcela (el recorrido numerado): fijo en el espacio, arriba al frente -->
      <a-entity id="menu-vistas" face-camera visible="false" position="0 1.9 -3">
        <a-plane width="2.05" height="1.95" color="#111111" opacity="0.9" shader="flat"></a-plane>
      </a-entity>

      <!-- Botón "Explorar la parcela": fijo abajo a la izquierda, sin tapar la estación -->
      <a-entity id="boton-vistas" face-camera position="-1.2 0.6 -2.2" scale="0.45 0.45 0.45">
        <a-plane width="1.88" height="0.36" color="#FFFFFF" shader="flat"></a-plane>
        <a-plane id="boton-vistas-clic" class="clickable" width="1.8" height="0.28" color="#FFFFFF" shader="flat" position="0 0 0.005"></a-plane>
      </a-entity>

      <a-camera></a-camera>

      <a-entity cursor="rayOrigin: mouse" raycaster="objects: .clickable; far: 60"></a-entity>
      <a-entity laser-controls="hand: left" raycaster="objects: .clickable; far: 60"></a-entity>
      <a-entity laser-controls="hand: right" raycaster="objects: .clickable; far: 60"></a-entity>

    </a-scene>

    <script>
      var sceneEl = document.querySelector('a-scene');
      var sky = document.querySelector('#sky');
      var ancla = document.querySelector('#ancla');
      var nombreEscena = document.querySelector('#nombre-escena');

      var infoPanel = document.querySelector('#info-panel');
      var panelesImagen = [
        document.querySelector('#panel-imagen'),
        document.querySelector('#panel-imagen-2'),
        document.querySelector('#panel-imagen-3')
      ];
      // Cada video tiene su propio panel. La clave es el "video" que pones en el punto.
      var videos = {
        videoDashboard: { panel: document.querySelector('#panel-video'),         video: document.querySelector('#videoDashboard') },
        videoHumedad:   { panel: document.querySelector('#panel-video-humedad'), video: document.querySelector('#videoHumedad') },
        videoMicroclima: { panel: document.querySelector('#panel-video-microclima'), video: document.querySelector('#videoMicroclima') }
      };
      function cadaVideo(f) { Object.keys(videos).forEach(function (k) { f(videos[k]); }); }
      var cerrarBtn = document.querySelector('#cerrar-panel');

      // ================== CONFIGURACIÓN ==================
      // Todas las fotos 360 miden 8000 x 4000 px.
      var ANCHO_FOTO = 8000, ALTO_FOTO = 4000;
      var RADIO = 20;                      // distancia de los íconos (m): más lejos = más "al fondo" en las gafas
      var COLOR_IMAGEN = '#2196F3', COLOR_VIDEO = '#FF9800';

      // skyRot: giro de la foto para que lo importante quede AL FRENTE al entrar.
      // puntos: los íconos de información de esa escena. Cada uno tiene:
      //   contenido: (opcional) lista de cosas que se abren juntas, UNA SOBRE OTRA, de arriba a abajo:
      //           [ { imagen: 'a.jpg' }, { video: 'videoDashboard', razon: 0.52 }, { texto: '...' } ]
      //   numero: número que se dibuja dentro del ícono (con icono: 'numero')
      //   (en la escena) pitch: hacia dónde mira al abrir, en grados (negativo = hacia abajo; solo en computador)
      //   tipo:   'imagen' (abre una diapositiva), 'video' (abre un video; con "video" eliges cuál:
      //           'videoDashboard' por defecto, 'videoHumedad' o 'videoMicroclima') o 'texto' (abre un cartel con
      //           el texto que pongas en "texto")
      //   icono:  aspecto del ícono: 'play' (naranja con triángulo), 'info' (azul con "i") o
      //           'letrero' (cartel con cursor; usa "rotulo": ['línea 1', 'línea 2'] y "tam" = su ANCHO en grados).
      //           Si no lo pones, los videos usan 'play' y lo demás 'info'.
      //   archivo: la imagen que abre (solo tipo imagen)
      //   pix:    [x, y] del sensor en la foto 360 (en píxeles de 8000x4000)
      //   az, el: alternativa a "pix": dirección en grados, ya con la escena girada
      //   off:    [grados a la derecha, grados hacia arriba] para separar el
      //           ícono del sensor (con una línea que los une)
      //   gap:    grados que la línea se queda CORTA antes de llegar al sensor, para no
      //           taparlo (por defecto 1.5; sensores grandes necesitan más)
      //   tam:    tamaño del ícono en grados (por defecto 3)
      //   ancho:  ancho de la imagen que se abre, en metros (por defecto 1.3)
      //   lineaColor: color de la línea y del puntito (por defecto blanco; sobre cielo claro conviene uno oscuro)
      // El ORDEN de esta lista es el orden del recorrido: la primera es la 1), la segunda la 2)...
      var escenas = [
        {
          id: '#escena1', archivo: 'vista_interior_2.jpg?v=d7c8dd48', nombre: 'Adéntrate en la parcela digital',
          skyRot: 101,     // con qué parte de la foto se abre (se ve el camino entre las matas)
          pitch: -9,       // en computador abre mirando un poco hacia abajo (en gafas no aplica)
          puntos: [
            // Botón para conocer la parcela: flota sobre el camino
            { tipo: 'imagen', archivo: 'slide_parcela.jpg?v=4dc60a8c', icono: 'boton', rotulo: ['Conoce la Parcela', 'Agroclimática Digital'], tam: 24, az: 1, el: -15.5, ancho: 1.6 },
            // El señor del sombrero: hay que girar hacia atrás para encontrarlo
            { tipo: 'texto', icono: 'letrero', rotulo: ['Asistente virtual', 'Pulse aquí'], tam: 11, texto: 'Le cliqueaste muy fuerte, le dio rasquiña', ancho: 1.3, pix: [4830, 1915], off: [0, 8] }
          ]
        },
        {
          id: null, archivo: 'estacion_desinstalada.jpg?v=9959a3f2', nombre: 'Conoce a detalle los sensores',
          skyRot: -94,
          // numero: el número que se ve dentro del ícono (1 = datalogger ... 7 = potencial mátrico)
          puntos: [
            { tipo: 'imagen', icono: 'numero', numero: 1, archivo: 'slide_datalogger.jpg?v=debe0bbb',    pix: [4051, 1813], off: [6, 2], gap: 2.4 },
            { tipo: 'imagen', icono: 'numero', numero: 2, archivo: 'slide_pluviometro.jpg?v=ff4ce8a7',   pix: [3738, 1893], off: [-6, 3], gap: 3.3 },
            { tipo: 'imagen', icono: 'numero', numero: 3, archivo: 'slide_nivel_freatico.jpg?v=360e56e7', pix: [3818, 2155], off: [-5.8, -10], gap: 2 },
            { tipo: 'imagen', icono: 'numero', numero: 4, archivo: 'slide_npk.jpg?v=207b7da4',           pix: [3842, 2145], off: [-1.9, -10.5], gap: 2.6 },
            { tipo: 'imagen', icono: 'numero', numero: 5, archivo: 'slide_multivariable.jpg?v=f88f67cb', pix: [3884, 2132], off: [1.2, -11.1], gap: 2.6 },
            { tipo: 'imagen', icono: 'numero', numero: 6, archivo: 'slide_temp_suelo.jpg?v=b56adb0a',    pix: [3946, 2190], off: [3.4, -8.45], gap: 1.2 },
            { tipo: 'imagen', icono: 'numero', numero: 7, archivo: 'slide_pot_matrico.jpg?v=9e96a761',   pix: [4090, 2265], off: [6, -2], gap: 1.6 }
          ]
        },
        {
          id: null, archivo: 'estacion_instalada.jpg?v=b34e336a', nombre: 'Estación principal',
          skyRot: -99.1,
          puntos: [ {
            tipo: 'video', icono: 'info', pix: [3982, 2420], off: [-8.29, -4], gap: 2, tam: 5,
            // Al pulsarlo se abren, una sobre otra: primero el slide que explica la estación y debajo el video
            contenido: [ { imagen: 'slide_estacion.jpg?v=72d5ea48' }, { video: 'videoDashboard', razon: 0.517 } ],
            ancho: 1.4
          } ]
        },
        {
          id: null, archivo: 'sensor_microclima_zoom.jpg?v=bf97fd49', nombre: 'Conoce el sensor de microclima',
          skyRot: -38,
          puntos: [ { tipo: 'video', icono: 'info', video: 'videoMicroclima', ancho: 2, razon: 0.533, pix: [5154, 1678], off: [5, -2], gap: 1.7 } ]
        },
        {
          id: null, archivo: 'sensor_humedad_suelo.jpg?v=f722554f', nombre: 'Conoce el sensor de humedad del suelo y la cámara',
          skyRot: 145.2,
          puntos: [
            { tipo: 'video', icono: 'info', video: 'videoHumedad', ancho: 1.8, razon: 0.4, pix: [2182, 2340], off: [-12, -3], gap: 3, tam: 4.7 },
            // Cámara de monitoreo (poste de la izquierda): al pulsarla se abren, una sobre otra, el slide y la imagen de ejemplo
            { tipo: 'imagen', pix: [382, 1647], off: [-8, 4], gap: 1.5, lineaColor: '#1565C0',
              contenido: [ { imagen: 'slide_camara.jpg?v=5ec87846' }, { imagen: 'camara_segmentacion.jpg?v=632dafcd' } ] }
          ]
        },
        { id: null, archivo: 'vista_superior.jpg?v=d67fa837', nombre: 'Observa el cultivo desde arriba', skyRot: 0, puntos: [] }
      ];

      // Texto del recorrido: "1) Estación principal", "2) Conoce a detalle los sensores"...
      function etiquetaEscena(indice) { return (indice + 1) + ') ' + escenas[indice].nombre; }
      var pasoActual = 0;
      var ultimoPedido = 0;

      // Un objeto invisible sigue recibiendo clics en A-Frame, así que
      // además de ocultarlo hay que quitarle la clase "clickable".
      function setClickable(el, activo) {
        if (activo) { el.classList.add('clickable'); } else { el.classList.remove('clickable'); }
      }

      // ---------- Carga de imágenes bajo demanda ----------
      var cacheFotos = {};
      var esperando = {};
      function cargarImagen(archivo, cb) {
        if (cacheFotos[archivo]) { cb(cacheFotos[archivo].id); return; }
        if (esperando[archivo]) { esperando[archivo].push(cb); return; }
        esperando[archivo] = [cb];
        var img = document.createElement('img');
        var id = 'foto_' + archivo.replace(/[^a-zA-Z0-9]/g, '_');
        img.setAttribute('id', id);
        img.setAttribute('crossorigin', 'anonymous');
        img.addEventListener('load', function () {
          cacheFotos[archivo] = { id: id };
          var lista = esperando[archivo];
          delete esperando[archivo];
          lista.forEach(function (f) { f(id); });
        });
        img.setAttribute('src', archivo);
        document.querySelector('a-assets').appendChild(img);
      }

      // ---------- Botón bonito: pastilla verde con brillo, borde blanco y un brote ----------
      var cacheBotones = {};
      function texturaBoton(linea1, linea2) {
        var clave = linea1 + '|' + linea2;
        if (cacheBotones[clave]) return cacheBotones[clave];
        var W = 1000, H = 280, m = 18, b = 7;            // m: margen para la sombra; b: grosor del borde blanco
        var canvas = document.createElement('canvas');
        canvas.width = W; canvas.height = H;
        var x = canvas.getContext('2d');

        function pastilla(x0, y0, w, h) {
          var r = h / 2;
          x.beginPath();
          x.moveTo(x0 + r, y0);
          x.lineTo(x0 + w - r, y0);
          x.arc(x0 + w - r, y0 + r, r, -Math.PI / 2, Math.PI / 2);
          x.lineTo(x0 + r, y0 + h);
          x.arc(x0 + r, y0 + r, r, Math.PI / 2, Math.PI * 1.5);
          x.closePath();
        }

        // Borde blanco con sombra suave
        x.save();
        x.shadowColor = 'rgba(0, 0, 0, 0.45)'; x.shadowBlur = 16; x.shadowOffsetY = 6;
        pastilla(m, m, W - 2 * m, H - 2 * m);
        x.fillStyle = '#FFFFFF'; x.fill();
        x.restore();

        // Relleno verde con degradado y un brillo en la mitad de arriba
        var ix = m + b, iy = m + b, iw = W - 2 * m - 2 * b, ih = H - 2 * m - 2 * b;
        pastilla(ix, iy, iw, ih);
        var g = x.createLinearGradient(0, iy, 0, iy + ih);
        g.addColorStop(0, '#66BB6A'); g.addColorStop(0.55, '#2E7D32'); g.addColorStop(1, '#1B5E20');
        x.fillStyle = g; x.fill();
        x.save();
        pastilla(ix, iy, iw, ih); x.clip();
        var brillo = x.createLinearGradient(0, iy, 0, iy + ih / 2);
        brillo.addColorStop(0, 'rgba(255, 255, 255, 0.32)'); brillo.addColorStop(1, 'rgba(255, 255, 255, 0)');
        x.fillStyle = brillo; x.fillRect(ix, iy, iw, ih / 2);
        x.restore();

        // Insignia: círculo blanco con un brote (dos hojitas y un tallo)
        var cx = ix + ih / 2 + 4, cy = H / 2, rb = 84;
        x.beginPath(); x.arc(cx, cy, rb, 0, Math.PI * 2); x.fillStyle = '#FFFFFF'; x.fill();
        x.strokeStyle = '#2E7D32'; x.fillStyle = '#2E7D32'; x.lineWidth = 10; x.lineCap = 'round';
        x.beginPath(); x.moveTo(cx, cy + 46); x.quadraticCurveTo(cx + 3, cy + 16, cx, cy - 8); x.stroke();
        x.beginPath(); x.ellipse(cx - 24, cy - 6, 32, 15, 0.62, 0, Math.PI * 2); x.fill();
        x.beginPath(); x.ellipse(cx + 26, cy - 26, 38, 17, -0.62, 0, Math.PI * 2); x.fill();

        // Textos (se achican solos si no caben)
        x.textAlign = 'left'; x.textBaseline = 'middle';
        x.shadowColor = 'rgba(0, 0, 0, 0.35)'; x.shadowBlur = 6; x.shadowOffsetY = 2;
        function linea(texto, tam, color, y) {
          x.font = 'bold ' + tam + 'px sans-serif';
          while (x.measureText(texto).width > 640 && tam > 24) { tam -= 2; x.font = 'bold ' + tam + 'px sans-serif'; }
          x.fillStyle = color; x.fillText(texto, 262, y);
        }
        linea(linea1, 58, '#FFFFFF', 108);
        linea(linea2, 58, '#FFF59D', 176);

        cacheBotones[clave] = canvas.toDataURL('image/png');
        return cacheBotones[clave];
      }

      // ---------- Número dentro de un círculo azul ----------
      var cacheNumeros = {};
      function texturaNumero(n) {
        if (cacheNumeros[n]) return cacheNumeros[n];
        var canvas = document.createElement('canvas');
        canvas.width = 256; canvas.height = 256;
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = '#2196F3';
        ctx.fillRect(0, 0, 256, 256);
        ctx.fillStyle = '#FFFFFF';
        ctx.font = 'bold 168px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(String(n), 128, 140);
        cacheNumeros[n] = canvas.toDataURL('image/png');
        return cacheNumeros[n];
      }

      // ---------- Letrero: cartel verde con un cursor y dos líneas de texto ----------
      var cacheLetreros = {};
      function texturaLetrero(linea1, linea2) {
        var clave = linea1 + '|' + linea2;
        if (cacheLetreros[clave]) return cacheLetreros[clave];
        var canvas = document.createElement('canvas');
        canvas.width = 768; canvas.height = 256;
        var ctx = canvas.getContext('2d');

        function rectRedondo(x, y, w, h, r) {
          ctx.beginPath();
          ctx.moveTo(x + r, y);
          ctx.arcTo(x + w, y, x + w, y + h, r);
          ctx.arcTo(x + w, y + h, x, y + h, r);
          ctx.arcTo(x, y + h, x, y, r);
          ctx.arcTo(x, y, x + w, y, r);
          ctx.closePath();
        }
        rectRedondo(4, 4, 760, 248, 46);  ctx.fillStyle = '#FFFFFF'; ctx.fill();   // borde blanco
        rectRedondo(14, 14, 740, 228, 38); ctx.fillStyle = '#1B5E20'; ctx.fill();   // fondo verde

        // Insignia: círculo blanco con el cursor de "clic" adentro
        ctx.beginPath(); ctx.arc(120, 128, 80, 0, Math.PI * 2); ctx.fillStyle = '#FFFFFF'; ctx.fill();
        var flecha = [[88, 84], [88, 166], [110, 146], [125, 184], [143, 176], [128, 140], [158, 140]];
        ctx.beginPath();
        ctx.moveTo(flecha[0][0], flecha[0][1]);
        for (var i = 1; i < flecha.length; i++) ctx.lineTo(flecha[i][0], flecha[i][1]);
        ctx.closePath(); ctx.fillStyle = '#1B5E20'; ctx.fill();

        // Textos (se achican solos si no caben)
        ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
        function linea(texto, tam, color, y) {
          ctx.font = 'bold ' + tam + 'px sans-serif';
          while (ctx.measureText(texto).width > 500 && tam > 20) { tam -= 2; ctx.font = 'bold ' + tam + 'px sans-serif'; }
          ctx.fillStyle = color; ctx.fillText(texto, 226, y);
        }
        linea(linea1, 50, '#FFFFFF', 102);
        linea(linea2, 46, '#FFEB3B', 168);

        cacheLetreros[clave] = canvas.toDataURL('image/png');
        return cacheLetreros[clave];
      }

      // ---------- Texto convertido en imagen (cualquier letra o acento se ve bien) ----------
      var cacheTextos = {};
      var contadorTextos = 0;
      function imagenDeTexto(texto, cb) {
        if (cacheTextos[texto]) { cb(cacheTextos[texto]); return; }
        var ANCHO = 1024, ALTO = 320;
        var canvas = document.createElement('canvas');
        canvas.width = ANCHO; canvas.height = ALTO;
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, ANCHO, ALTO);
        ctx.fillStyle = '#1B5E20';
        ctx.fillRect(12, 12, ANCHO - 24, ALTO - 24);
        ctx.fillStyle = '#FFFFFF';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        // Busca la letra más grande con la que el texto cabe (en varias líneas) dentro del cartel
        var maxAncho = 900, maxAlto = 230, tamano = 110, lineas = [];
        for (; tamano >= 28; tamano -= 4) {
          ctx.font = 'bold ' + tamano + 'px sans-serif';
          lineas = [];
          var actual = '';
          texto.split(' ').forEach(function (palabra) {
            var prueba = actual ? actual + ' ' + palabra : palabra;
            if (ctx.measureText(prueba).width > maxAncho && actual) { lineas.push(actual); actual = palabra; }
            else { actual = prueba; }
          });
          lineas.push(actual);
          var cabe = lineas.every(function (l) { return ctx.measureText(l).width <= maxAncho; });
          if (cabe && lineas.length * tamano * 1.25 <= maxAlto) break;
        }
        var altoLinea = tamano * 1.25;
        var y0 = ALTO / 2 - (lineas.length - 1) * altoLinea / 2;
        lineas.forEach(function (l, i) { ctx.fillText(l, ANCHO / 2, y0 + i * altoLinea); });

        var id = 'texto_' + (contadorTextos++);
        var img = document.createElement('img');
        img.setAttribute('id', id);
        img.addEventListener('load', function () { cacheTextos[texto] = id; cb(id); });
        img.setAttribute('src', canvas.toDataURL('image/png'));
        document.querySelector('a-assets').appendChild(img);
      }

      // ---------- Geometría: de la foto 360 a un punto en el espacio ----------
      function direccion(p, escena) {
        if (p.pix) {
          return {
            az: (p.pix[0] / ANCHO_FOTO - 0.75) * 360 - escena.skyRot,
            el: 90 - (p.pix[1] / ALTO_FOTO) * 180
          };
        }
        return { az: p.az, el: p.el };
      }
      function vectorDesde(az, el, r) {
        var a = az * Math.PI / 180, e = el * Math.PI / 180;
        return { x: r * Math.cos(e) * Math.sin(a), y: r * Math.sin(e), z: -r * Math.cos(e) * Math.cos(a) };
      }

      // ---------- Íconos de información ----------
      var iconos = [];

      function limpiarIconos() {
        iconos.forEach(function (g) { if (g.parentNode) g.parentNode.removeChild(g); });
        iconos = [];
      }

      function crearPunto(p, escena, indiceEscena) {
        var d = direccion(p, escena);
        var off = p.off || [0, 0];
        var azI = d.az + off[0], elI = d.el + off[1];
        var r = RADIO;
        var R = r * Math.tan((p.tam || 3) / 2 * Math.PI / 180);   // radio del círculo
        var k = R / 0.15;
        var dz = r * 0.002;              // separación mínima entre capas (evita parpadeos)
        var pos = vectorDesde(azI, elI, r);

        var grupo = document.createElement('a-entity');
        grupo.setAttribute('face-camera', '');
        grupo.setAttribute('position', pos.x + ' ' + pos.y + ' ' + pos.z);

        // Si el ícono está separado del sensor: una línea (que se queda corta
        // antes de llegar al sensor, para no taparlo) y un puntito al final
        if (off[0] !== 0 || off[1] !== 0) {
          var derecha = (d.az - azI) * Math.PI / 180 * r * Math.cos(elI * Math.PI / 180);
          var arriba = (d.el - elI) * Math.PI / 180 * r;
          var dist = Math.sqrt(derecha * derecha + arriba * arriba);
          var hueco = (p.gap !== undefined ? p.gap : 1.5) * Math.PI / 180 * r;
          var finDer = derecha, finArr = arriba;
          if (dist > hueco) {
            var f = (dist - hueco) / dist;
            finDer = derecha * f;
            finArr = arriba * f;
          }
          var largo = Math.sqrt(finDer * finDer + finArr * finArr);

          var linea = document.createElement('a-plane');
          linea.setAttribute('width', largo);
          linea.setAttribute('height', r * 0.004);
          linea.setAttribute('color', p.lineaColor || '#FFFFFF');
          linea.setAttribute('shader', 'flat');
          linea.setAttribute('opacity', 0.9);
          linea.setAttribute('position', (finDer / 2) + ' ' + (finArr / 2) + ' ' + (-dz));
          linea.setAttribute('rotation', '0 0 ' + (Math.atan2(finArr, finDer) * 180 / Math.PI));
          grupo.appendChild(linea);

          var puntito = document.createElement('a-circle');
          puntito.setAttribute('radius', r * 0.0035);
          puntito.setAttribute('color', p.lineaColor || '#FFFFFF');
          puntito.setAttribute('shader', 'flat');
          puntito.setAttribute('position', finDer + ' ' + finArr + ' ' + (-dz));
          grupo.appendChild(puntito);
        }

        var circulo = document.createElement('a-entity');
        circulo.setAttribute('class', 'clickable');
        // Aspecto del ícono: 'play' (naranja con triángulo), 'info' (azul con "i"), 'numero'
        // (azul con un número), 'letrero' (cartel con un cursor) o 'boton' (pastilla verde con un brote). Por defecto, los videos usan
        // 'play' y lo demás 'info'; con "icono" se puede cambiar.
        var estilo = p.icono || (p.tipo === 'video' ? 'play' : 'info');

        if (estilo === 'letrero') {
          // Cartel rectangular: "tam" es su ANCHO en grados; el alto es un tercio.
          var rotulo = p.rotulo || ['Asistente virtual', 'Pulse aquí'];
          circulo.setAttribute('geometry', 'primitive: plane; width: ' + (2 * R) + '; height: ' + (2 * R / 3));
          circulo.setAttribute('material', { shader: 'flat', src: texturaLetrero(rotulo[0], rotulo[1]), transparent: true });
          circulo.setAttribute('animation__pulse', 'property: scale; dir: alternate; dur: 1100; easing: easeInOutSine; loop: true; from: 1 1 1; to: 1.05 1.05 1.05');
        } else if (estilo === 'boton') {
          // Pastilla: "tam" es su ANCHO en grados; el alto sale de la proporción del dibujo (1000 x 280)
          var rotuloB = p.rotulo || ['Conoce', 'más'];
          circulo.setAttribute('geometry', 'primitive: plane; width: ' + (2 * R) + '; height: ' + (2 * R * 280 / 1000));
          circulo.setAttribute('material', { shader: 'flat', src: texturaBoton(rotuloB[0], rotuloB[1]), transparent: true });
          circulo.setAttribute('animation__pulse', 'property: scale; dir: alternate; dur: 1200; easing: easeInOutSine; loop: true; from: 1 1 1; to: 1.06 1.06 1.06');
        } else if (estilo === 'numero') {
          // Círculo azul con un número adentro (el número se dibuja como imagen)
          circulo.setAttribute('geometry', 'primitive: circle; radius: ' + R + '; segments: 48');
          circulo.setAttribute('material', { shader: 'flat', src: texturaNumero(p.numero) });
          circulo.setAttribute('animation__pulse', 'property: scale; dir: alternate; dur: 1000; easing: easeInOutSine; loop: true; from: 1 1 1; to: 1.15 1.15 1.15');
        } else {
          circulo.setAttribute('geometry', 'primitive: circle; radius: ' + R + '; segments: 32');
          circulo.setAttribute('material', 'shader: flat; color: ' + (estilo === 'play' ? COLOR_VIDEO : COLOR_IMAGEN));
          circulo.setAttribute('animation__pulse', 'property: scale; dir: alternate; dur: 1000; easing: easeInOutSine; loop: true; from: 1 1 1; to: 1.15 1.15 1.15');

          if (estilo === 'play') {
            var tri = document.createElement('a-triangle');
            tri.setAttribute('color', '#FFFFFF');
            tri.setAttribute('shader', 'flat');
            tri.setAttribute('vertex-a', (-0.045 * k) + ' ' + (0.06 * k) + ' ' + dz);
            tri.setAttribute('vertex-b', (-0.045 * k) + ' ' + (-0.06 * k) + ' ' + dz);
            tri.setAttribute('vertex-c', (0.07 * k) + ' 0 ' + dz);
            circulo.appendChild(tri);
          } else {
            // La "i" se dibuja con formas (un punto y un palito), sin depender de ninguna fuente
            var punto = document.createElement('a-circle');
            punto.setAttribute('radius', R * 0.12);
            punto.setAttribute('color', '#FFFFFF');
            punto.setAttribute('shader', 'flat');
            punto.setAttribute('position', '0 ' + (R * 0.40) + ' ' + dz);
            circulo.appendChild(punto);
            var palito = document.createElement('a-plane');
            palito.setAttribute('width', R * 0.24);
            palito.setAttribute('height', R * 0.52);
            palito.setAttribute('color', '#FFFFFF');
            palito.setAttribute('shader', 'flat');
            palito.setAttribute('position', '0 ' + (-R * 0.14) + ' ' + dz);
            circulo.appendChild(palito);
          }
        }

        circulo.addEventListener('click', function () { abrirPanel(p, grupo, indiceEscena); });
        grupo.appendChild(circulo);
        return grupo;
      }

      // ---------- Panel de información ----------
      function cerrarPanel() {
        infoPanel.setAttribute('visible', false);
        panelesImagen.forEach(function (e) { e.setAttribute('visible', false); });
        cadaVideo(function (v) { v.panel.setAttribute('visible', false); setClickable(v.panel, false); v.video.pause(); });
        setClickable(cerrarBtn, false);
      }

      // Lista de lo que abre un punto (una o varias cosas, de arriba a abajo)
      function itemsDe(p) {
        if (p.contenido) return p.contenido;
        if (p.tipo === 'video') return [{ video: p.video || 'videoDashboard', razon: p.razon }];
        if (p.tipo === 'texto') return [{ texto: p.texto }];
        return [{ imagen: p.archivo }];
      }
      function anchoDe(p, items) {
        if (p.ancho) return p.ancho;
        if (items.some(function (i) { return i.video; })) return 1.6;
        if (items.some(function (i) { return i.texto; })) return 1.2;
        return 1.3;
      }

      function abrirPanel(p, grupo, indiceEscena) {
        cerrarMenu();

        // El panel se abre justo AL FRENTE de donde estás mirando (a 1.8 m, a la altura
        // de los ojos) y siempre derecho, sin importar en qué parte de la escena esté el ícono.
        var camPos = new THREE.Vector3();
        var mira = new THREE.Vector3();
        if (sceneEl.camera) { sceneEl.camera.getWorldPosition(camPos); } else { camPos.set(0, 1.6, 0); }
        if (sceneEl.camera && sceneEl.camera.getWorldDirection) { sceneEl.camera.getWorldDirection(mira); } else { mira.x = 0; mira.z = -1; }
        var hx = mira.x, hz = mira.z;
        var largoH = Math.sqrt(hx * hx + hz * hz);
        if (largoH < 0.2) {                       // mirando casi hacia arriba o abajo: usa la dirección del ícono
          var iconPos = new THREE.Vector3();
          grupo.object3D.getWorldPosition(iconPos);
          hx = iconPos.x - camPos.x; hz = iconPos.z - camPos.z;
          if (Math.abs(hx) + Math.abs(hz) < 0.000001) { hx = 0; hz = -1; }
          largoH = Math.sqrt(hx * hx + hz * hz);
        }
        infoPanel.object3D.position.set(camPos.x + hx / largoH * 1.8, camPos.y + 0.05, camPos.z + hz / largoH * 1.8);

        // Prepara cada cosa que se va a mostrar y, cuando todas están listas, las acomoda
        var items = itemsDe(p);
        var ancho = anchoDe(p, items);
        var listos = new Array(items.length);
        var faltan = items.length;
        function terminado() { if (--faltan === 0) montarPanel(listos, ancho, indiceEscena); }
        items.forEach(function (it, i) {
          if (it.video) {
            var v = videos[it.video];
            var razon = v.video.videoWidth > 0 ? v.video.videoHeight / v.video.videoWidth : (it.razon || 0.52);
            listos[i] = { video: v, razon: razon };
            terminado();
          } else if (it.texto) {
            imagenDeTexto(it.texto, function (id) { listos[i] = { id: id }; terminado(); });
          } else {
            cargarImagen(it.imagen, function (id) { listos[i] = { id: id }; terminado(); });
          }
        });
      }

      // Acomoda varias cosas una sobre otra, centradas, todas del mismo ancho
      function montarPanel(listos, ancho, indiceEscena) {
        if (pasoActual !== indiceEscena) return;      // ya cambió de escena
        var SEPARACION = 0.06;
        panelesImagen.forEach(function (e) { e.setAttribute('visible', false); });
        cadaVideo(function (o) { o.panel.setAttribute('visible', false); setClickable(o.panel, false); o.video.pause(); });

        var alturas = listos.map(function (it) {
          if (it.video) return ancho * it.razon;
          var img = document.getElementById(it.id);
          return ancho * img.naturalHeight / img.naturalWidth;
        });
        var total = alturas.reduce(function (a, b) { return a + b; }, 0) + SEPARACION * (listos.length - 1);
        var y = total / 2;                            // se empieza por arriba
        var usadas = 0, aReproducir = null;

        listos.forEach(function (it, i) {
          var alto = alturas[i];
          var centro = y - alto / 2;
          y -= alto + SEPARACION;
          if (it.video) {
            it.video.panel.setAttribute('width', ancho);
            it.video.panel.setAttribute('height', alto);
            it.video.panel.setAttribute('position', '0 ' + centro + ' 0');
            it.video.panel.setAttribute('visible', true);
            setClickable(it.video.panel, true);
            aReproducir = it.video.video;
          } else {
            var marco = panelesImagen[usadas++];
            if (!marco) return;
            marco.setAttribute('src', '#' + it.id);
            marco.setAttribute('width', ancho);
            marco.setAttribute('height', alto);
            marco.setAttribute('position', '0 ' + centro + ' 0');
            marco.setAttribute('visible', true);
          }
        });

        cerrarBtn.setAttribute('position', (ancho / 2) + ' ' + (total / 2) + ' 0.03');
        infoPanel.setAttribute('visible', true);
        setClickable(cerrarBtn, true);
        if (aReproducir) { aReproducir.currentTime = 0; aReproducir.play(); }
      }

      // En PC, al cambiar de escena vuelve a mirar al frente
      function mirarAlFrente(escena) {
        var camEl = document.querySelector('a-camera');
        var lc = camEl && camEl.components && camEl.components['look-controls'];
        if (lc && lc.yawObject && lc.pitchObject && !sceneEl.is('vr-mode')) {
          lc.yawObject.rotation.y = 0;
          lc.pitchObject.rotation.x = ((escena && escena.pitch) || 0) * Math.PI / 180;
        }
      }

      // ---------- Cambio de escena ----------
      function mostrarEscena(indice) {
        pasoActual = indice;
        var escena = escenas[indice];
        var referencia = escena.id ? escena.id : ('#' + cacheFotos[escena.archivo].id);
        sky.setAttribute('src', referencia);
        sky.setAttribute('rotation', '0 ' + escena.skyRot + ' 0');
        nombreEscena.textContent = etiquetaEscena(indice);
        cerrarPanel();
        cerrarMenu();

        limpiarIconos();
        (escena.puntos || []).forEach(function (p) {
          var g = crearPunto(p, escena, indice);
          ancla.appendChild(g);
          iconos.push(g);
          itemsDe(p).forEach(function (it) { if (it.imagen) cargarImagen(it.imagen, function () {}); });   // las va precargando
        });

        mirarAlFrente(escena);
      }

      function irAEscena(indice) {
        var escena = escenas[indice];
        ultimoPedido = indice;
        if (escena.id || cacheFotos[escena.archivo]) {
          mostrarEscena(indice);
          return;
        }
        nombreEscena.textContent = 'Cargando ' + etiquetaEscena(indice) + '...';
        cargarImagen(escena.archivo, function () {
          if (ultimoPedido === indice) mostrarEscena(indice);
        });
      }

      cerrarBtn.addEventListener('click', cerrarPanel);
      cadaVideo(function (v) {
        v.panel.addEventListener('click', function () {
          if (v.video.paused) { v.video.play(); } else { v.video.pause(); }
        });
      });

      // ================== MENÚ "EXPLORAR LA PARCELA" (el recorrido numerado) ==================
      var menuVistas = document.querySelector('#menu-vistas');
      var botonVistas = document.querySelector('#boton-vistas-clic');
      (function () {
        var c = document.createElement('canvas');
        c.width = 1288; c.height = 200;
        var x = c.getContext('2d');
        x.fillStyle = '#2E7D32'; x.fillRect(0, 0, 1288, 200);
        x.fillStyle = '#FFFFFF'; x.textAlign = 'center'; x.textBaseline = 'middle';
        var tam = 112;
        x.font = 'bold ' + tam + 'px sans-serif';
        while (x.measureText('Explorar la parcela').width > 1190 && tam > 40) { tam -= 4; x.font = 'bold ' + tam + 'px sans-serif'; }
        x.fillText('Explorar la parcela', 644, 106);
        botonVistas.setAttribute('material', { shader: 'flat', color: '#FFFFFF', src: c.toDataURL('image/png') });
      })();
      var menuAbierto = false;
      var columnas = 2, filas = 3;
      var anchoTarjeta = 0.95, altoTarjeta = 0.55, espacio = 0.06;
      var tarjetas = [];

      function crearTexturaTexto(texto) {
        var canvas = document.createElement('canvas');
        canvas.width = 512; canvas.height = 256;
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = '#1B5E20';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#FFFFFF';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        // Busca la letra más grande con la que el texto cabe (en varias líneas) dentro de la tarjeta
        var maxAncho = canvas.width - 44, maxAlto = canvas.height - 40;
        var tamano = 48, lineas = [];
        for (; tamano >= 26; tamano -= 2) {
          ctx.font = 'bold ' + tamano + 'px sans-serif';
          lineas = [];
          var actual = '';
          texto.split(' ').forEach(function (palabra) {
            var prueba = actual ? actual + ' ' + palabra : palabra;
            if (ctx.measureText(prueba).width > maxAncho && actual) { lineas.push(actual); actual = palabra; }
            else { actual = prueba; }
          });
          lineas.push(actual);
          var cabe = lineas.every(function (l) { return ctx.measureText(l).width <= maxAncho; });
          if (cabe && lineas.length * tamano * 1.18 <= maxAlto) break;
        }
        var alturaLinea = tamano * 1.18;
        var yInicial = canvas.height / 2 - ((lineas.length - 1) * alturaLinea) / 2;
        lineas.forEach(function (linea, i) {
          ctx.fillText(linea, canvas.width / 2, yInicial + i * alturaLinea);
        });
        return canvas.toDataURL('image/png');
      }

      escenas.forEach(function (escena, indice) {
        var col = indice % columnas;
        var fila = Math.floor(indice / columnas);
        var x = (col - 0.5) * (anchoTarjeta + espacio);
        var y = (filas - 1) / 2 * (altoTarjeta + espacio) - fila * (altoTarjeta + espacio);
        var tarjeta = document.createElement('a-entity');
        tarjeta.setAttribute('geometry', 'primitive: plane; width: ' + anchoTarjeta + '; height: ' + altoTarjeta);
        tarjeta.setAttribute('material', { shader: 'flat', src: crearTexturaTexto(etiquetaEscena(indice)) });
        tarjeta.setAttribute('position', x + ' ' + y + ' 0.01');
        tarjeta.addEventListener('click', function () { irAEscena(indice); });
        menuVistas.appendChild(tarjeta);
        tarjetas.push(tarjeta);
      });

      function abrirMenu() {
        cerrarPanel();
        menuVistas.setAttribute('visible', true);
        tarjetas.forEach(function (t) { setClickable(t, true); });
        menuAbierto = true;
      }
      function cerrarMenu() {
        menuVistas.setAttribute('visible', false);
        tarjetas.forEach(function (t) { setClickable(t, false); });
        menuAbierto = false;
      }

      botonVistas.addEventListener('click', function () {
        if (menuAbierto) { cerrarMenu(); } else { abrirMenu(); }
      });

      irAEscena(0);

      // ================== USO SIN INTERNET ==================
      // La primera vez que se abre CON internet, el navegador guarda todo (fotos, videos,
      // slides y la librería). Desde entonces funciona sin conexión. El texto de abajo a la
      // izquierda (en la pantalla normal, no dentro de las gafas) indica si ya quedó listo.
      (function () {
        var etiqueta = document.querySelector('#sin-internet');
        function mostrar(t) { if (etiqueta) etiqueta.textContent = t; }
        if (!('serviceWorker' in navigator)) { mostrar('Sin internet: no disponible en este navegador'); return; }
        var local = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        if (location.protocol !== 'https:' && !local) { mostrar('Sin internet: requiere una dirección https'); return; }

        navigator.serviceWorker.addEventListener('message', function (e) {
          var m = e.data || {};
          if (m.tipo === 'inicio' || m.tipo === 'progreso') {
            mostrar('Sin internet: descargando ' + (m.hechos || 0) + '/' + m.total + '…');
          } else if (m.tipo === 'estado') {
            mostrar(m.hechos === m.total
              ? 'Sin internet: listo ✓ (' + m.hechos + '/' + m.total + ' archivos)'
              : 'Sin internet: faltan ' + (m.total - m.hechos) + ' archivos (abre una vez con internet)');
          }
        });
        navigator.serviceWorker.register('sw.js')
          .then(function () { return navigator.serviceWorker.ready; })
          .then(function (reg) {
            var activo = navigator.serviceWorker.controller || reg.active;
            if (activo) activo.postMessage('estado');
          })
          .catch(function () { mostrar('Sin internet: no se pudo activar'); });
      })();
    </script>

  </body>
